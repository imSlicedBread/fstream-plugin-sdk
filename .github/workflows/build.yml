name: Build SDK and example
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build standalone SDK and development example
        run: ./gradlew :plugin-sdk:assembleRelease :plugin-sdk:sourceReleaseJar :plugin-test-pattern:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-and-development-example
          path: |
            plugin-sdk/build/outputs/aar/*.aar
            plugin-sdk/build/intermediates/source_jar/release/*sources.jar
            plugin-test-pattern/build/outputs/apk/debug/*.apk
